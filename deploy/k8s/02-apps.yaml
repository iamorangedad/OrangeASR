apiVersion: v1
kind: ConfigMap
metadata:
  name: asr-config
  namespace: default
data:
  # infrastructure
  NATS_URL: "nats://10.0.0.27:30742"
  MONGO_URI: "mongodb://10.0.0.27:30327"
  MONGO_DB: "asr_data"
  
  # MinIO / S3 
  S3_ENDPOINT: "http://10.0.0.27:30091"
  S3_ACCESS_KEY: "admin"
  S3_SECRET_KEY: "password123"
  S3_BUCKET: "audio"
  
  # ASR 
  LOG_SUBJECT: "asr.inference.stream"

---
# --- gateway Deployment ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: asr-gateway
  labels:
    app: asr-gateway
spec:
  replicas: 1  # advise for prod: 2+
  selector:
    matchLabels:
      app: asr-gateway
  template:
    metadata:
      labels:
        app: asr-gateway
    spec:
      nodeName: raspberrypi
      containers:
        - name: gateway
          image: flash-asr:1.0
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "src.gateway:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: asr-config
          # dir for code which is convenient for dev
          volumeMounts:
            - mountPath: /app
              name: code-volume
      volumes:
        - name: code-volume
          hostPath:
            path: /home/mac/FlashFineTune-ASR
            type: Directory
---
# --- gateway Service ---
apiVersion: v1
kind: Service
metadata:
  name: asr-gateway-svc
spec:
  type: NodePort
  selector:
    app: asr-gateway
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
      nodePort: 30081 
---
# --- asr storage Deployment ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: asr-storage
  labels:
    app: asr-storage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: asr-storage
  template:
    metadata:
      labels:
        app: asr-storage
    spec:
      nodeName: raspberrypi
      containers:
        - name: storage
          image: flash-asr:1.0
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "src.storage_worker"]
          envFrom:
            - configMapRef:
                name: asr-config
          volumeMounts:
            - mountPath: /app
              name: code-volume
      volumes:
        - name: code-volume
          hostPath:
            path: /home/mac/FlashFineTune-ASR
            type: Directory
---
# --- asr worker Deployment ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: asr-worker
  labels:
    app: asr-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: asr-worker
  template:
    metadata:
      labels:
        app: asr-worker
    spec:
      nodeName: ubuntu       
      containers:
        - name: worker
          image: faster-whisper-cuda:1.2
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "src.asr_worker"]          
          env:
            - name: ASR_DEVICE
              value: "cuda"
            - name: ASR_COMPUTE_TYPE
              value: "float16"
          envFrom:
            - configMapRef:
                name: asr-config      
          resources:
            limits:
              nvidia.com/gpu: 1              
          volumeMounts:
            - mountPath: /app
              name: code-volume
      volumes:
        - name: code-volume
          hostPath:
            path: /home/jetson/FlashFineTune-ASR
            type: Directory   
---
# --- Web UI Deployment ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: asr-web-ui
  labels:
    app: asr-web-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: asr-web-ui
  template:
    metadata:
      labels:
        app: asr-web-ui
    spec:
      nodeName: raspberrypi
      containers:
        - name: web-ui
          image: flash-asr:1.1
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "src.web_ui"]
          env:
            - name: PYTHONPATH
              value: "/app/src"          
          ports:
            - containerPort: 7860
          envFrom:
            - configMapRef:
                name: asr-config
          volumeMounts:
            - mountPath: /app
              name: code-volume
      volumes:
        - name: code-volume
          hostPath:
            path: /home/mac/FlashFineTune-ASR
            type: Directory

---
# --- Web UI Service ---
apiVersion: v1
kind: Service
metadata:
  name: asr-web-ui-svc
spec:
  type: NodePort
  selector:
    app: asr-web-ui
  ports:
    - protocol: TCP
      port: 7860
      targetPort: 7860
      nodePort: 30082
            
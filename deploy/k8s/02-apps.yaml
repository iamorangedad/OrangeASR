apiVersion: v1
kind: ConfigMap
metadata:
  name: asr-config
  namespace: default
data:
  # infrastructure
  NATS_URL: "nats://nats.asr-service.svc.cluster.local:4222"
  MONGO_URI: "mongodb://mongo.asr-service.svc.cluster.local:27017"
  MONGO_DB: "asr_data"
  
  # MinIO / S3 
  S3_ENDPOINT: "http://minio-service.asr-service.svc.cluster.local:9000"
  S3_ACCESS_KEY: "admin"
  S3_SECRET_KEY: "password123"
  S3_BUCKET: "audio"
  
  # Refiner (LLM-based ASR correction)
  OLLAMA_BASE_URL: "http://10.0.0.55:11434"
  OLLAMA_MODEL: "qwen3:4b"
  REFINE_BATCH_SIZE: "3"
  REFINE_BUFFER_TTL: "10"
  REFINE_TIMEOUT: "30"
  # Perf P0
  ASR_COMPUTE_TYPE: "int8_float16"
  USE_BINARY_PAYLOAD: "1"
  VAD_DISABLE: "0"
  GATEWAY_MIN_CHUNK_SEC: "0.8"
  GATEWAY_MAX_CHUNK_SEC: "1.5"
  GATEWAY_OVERLAP_SEC: "0.3"
  GATEWAY_MAX_PENDING: "20"
  GATEWAY_RATE_LIMIT_RPS: "10"
  ASR_MAX_CONCURRENCY: "2"
  ASR_BATCH_WINDOW_MS: "80"
  ASR_WARMUP: "1"

---
# --- gateway Deployment ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: asr-gateway
  labels:
    app: asr-gateway
spec:
  replicas: 1  # advise for prod: 2+
  selector:
    matchLabels:
      app: asr-gateway
  template:
    metadata:
      labels:
        app: asr-gateway
    spec:
      nodeName: raspberrypi
      containers:
        - name: gateway
           image: flash-asr:1.2
           imagePullPolicy: IfNotPresent
           command: ["uvicorn", "src.gateway:app", "--host", "0.0.0.0", "--port", "8000"]
           env:
             - name: PYTHONPATH
               value: "/app"
           ports:
             - containerPort: 8000
             - containerPort: 8080
               name: metrics
           envFrom:
             - configMapRef:
                 name: asr-config
           resources:
             requests:
               cpu: "100m"
               memory: "128Mi"
             limits:
               cpu: "500m"
               memory: "512Mi"
           livenessProbe:
             httpGet:
               path: /healthz
               port: 8000
             initialDelaySeconds: 15
             periodSeconds: 10
             timeoutSeconds: 3
             failureThreshold: 3
           readinessProbe:
             httpGet:
               path: /ready
               port: 8000
             initialDelaySeconds: 5
             periodSeconds: 5
             timeoutSeconds: 3
           volumeMounts:
             - mountPath: /app
               name: code-volume
       volumes:
         - name: code-volume
           hostPath:
             path: /home/mac/OrangeASR
             type: Directory
---
# --- gateway Service ---
apiVersion: v1
kind: Service
metadata:
  name: asr-gateway-svc
spec:
  type: NodePort
  selector:
    app: asr-gateway
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
      nodePort: 30081 
---
# --- asr storage Deployment ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: asr-storage
  labels:
    app: asr-storage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: asr-storage
  template:
    metadata:
      labels:
        app: asr-storage
    spec:
      nodeName: raspberrypi
      containers:
        - name: storage
           image: flash-asr:1.2
           imagePullPolicy: IfNotPresent
           command: ["python", "-m", "src.storage_worker"]
           env:
             - name: PYTHONPATH
               value: "/app"
           ports:
             - containerPort: 8082
               name: metrics
           envFrom:
             - configMapRef:
                 name: asr-config
           resources:
             requests:
               cpu: "100m"
               memory: "128Mi"
             limits:
               cpu: "500m"
               memory: "512Mi"
           livenessProbe:
             httpGet:
               path: /healthz
               port: 8082
             initialDelaySeconds: 15
             periodSeconds: 10
           readinessProbe:
             httpGet:
               path: /ready
               port: 8082
             initialDelaySeconds: 5
             periodSeconds: 5
           volumeMounts:
             - mountPath: /app
               name: code-volume
       volumes:
         - name: code-volume
           hostPath:
             path: /home/mac/OrangeASR
             type: Directory
---
# --- asr worker Deployment ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: asr-worker
  labels:
    app: asr-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: asr-worker
  template:
    metadata:
      labels:
        app: asr-worker
    spec:
      nodeName: ubuntu       
      containers:
        - name: worker
           image: faster-whisper-cuda:1.2
           imagePullPolicy: IfNotPresent
           command: ["python", "-m", "src.asr_worker"]          
           env:
             - name: PYTHONPATH
               value: "/app"
             - name: ASR_DEVICE
               value: "cuda"
             - name: ASR_COMPUTE_TYPE
               value: "int8_float16"
           ports:
             - containerPort: 8081
               name: metrics
           envFrom:
             - configMapRef:
                 name: asr-config      
           resources:
             requests:
               cpu: "100m"
               memory: "512Mi"
             limits:
               cpu: "1000m"
               memory: "2Gi"
               nvidia.com/gpu: 1              
           livenessProbe:
             httpGet:
               path: /healthz
               port: 8081
             initialDelaySeconds: 30
             periodSeconds: 10
             timeoutSeconds: 5
             failureThreshold: 3
           readinessProbe:
             httpGet:
               path: /ready
               port: 8081
             initialDelaySeconds: 10
             periodSeconds: 5
             timeoutSeconds: 3
           volumeMounts:
             - mountPath: /app
               name: code-volume
       volumes:
         - name: code-volume
           hostPath:
             path: /home/jetson/OrangeASR
             type: Directory
---
# --- Refiner Worker Deployment ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: asr-refiner
  labels:
    app: asr-refiner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: asr-refiner
  template:
    metadata:
      labels:
        app: asr-refiner
    spec:
      nodeName: raspberrypi
      containers:
        - name: refiner
           image: flash-asr:1.2
           imagePullPolicy: IfNotPresent
           command: ["python", "-m", "src.refiner_worker"]
           env:
             - name: PYTHONPATH
               value: "/app"
           ports:
             - containerPort: 8083
               name: metrics
           envFrom:
             - configMapRef:
                 name: asr-config
           resources:
             requests:
               cpu: "50m"
               memory: "128Mi"
             limits:
               cpu: "300m"
               memory: "512Mi"
           livenessProbe:
             httpGet:
               path: /healthz
               port: 8083
             initialDelaySeconds: 15
             periodSeconds: 10
           readinessProbe:
             httpGet:
               path: /ready
               port: 8083
             initialDelaySeconds: 5
             periodSeconds: 5
           volumeMounts:
             - mountPath: /app
               name: code-volume
       volumes:
         - name: code-volume
           hostPath:
             path: /home/mac/OrangeASR
             type: Directory

---
# --- Web UI Deployment ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: asr-web-ui
  labels:
    app: asr-web-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: asr-web-ui
  template:
    metadata:
      labels:
        app: asr-web-ui
    spec:
      nodeName: raspberrypi
      containers:
        - name: web-ui
          image: flash-asr:1.2
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "src.web_ui"]
          env:
            - name: PYTHONPATH
              value: "/app"          
          ports:
            - containerPort: 7860
          envFrom:
            - configMapRef:
                name: asr-config
          volumeMounts:
            - mountPath: /app
              name: code-volume
      volumes:
        - name: code-volume
          hostPath:
            path: /home/mac/OrangeASR
            type: Directory

---
# --- Web UI Service ---
apiVersion: v1
kind: Service
metadata:
  name: asr-web-ui-svc
spec:
  type: NodePort
  selector:
    app: asr-web-ui
  ports:
    - protocol: TCP
      port: 7860
      targetPort: 7860
      nodePort: 30082
            
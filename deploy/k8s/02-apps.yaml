apiVersion: v1
kind: ConfigMap
metadata:
  name: asr-config
  namespace: default
data:
  # infrastructure
  NATS_URL: "nats://nats.asr-service.svc.cluster.local:4222"
  MONGO_URI: "mongodb://mongo.asr-service.svc.cluster.local:27017"
  MONGO_DB: "asr_data"
  
  # MinIO / S3 
  S3_ENDPOINT: "http://minio-service.asr-service.svc.cluster.local:9000"
  S3_ACCESS_KEY: "admin"
  S3_SECRET_KEY: "password123"
  S3_BUCKET: "audio"
  
  # Refiner (LLM-based ASR correction)
  OLLAMA_BASE_URL: "http://10.0.0.55:11434"
  OLLAMA_MODEL: "qwen3:4b"
  REFINE_BATCH_SIZE: "3"
  REFINE_BUFFER_TTL: "10"
  REFINE_TIMEOUT: "30"

---
# --- gateway Deployment ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: asr-gateway
  labels:
    app: asr-gateway
spec:
  replicas: 1  # advise for prod: 2+
  selector:
    matchLabels:
      app: asr-gateway
  template:
    metadata:
      labels:
        app: asr-gateway
    spec:
      nodeName: raspberrypi
      containers:
        - name: gateway
          image: flash-asr:1.2
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "src.gateway:app", "--host", "0.0.0.0", "--port", "8000"]
          env:
            - name: PYTHONPATH
              value: "/app"
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: asr-config
          # dir for code which is convenient for dev
          volumeMounts:
            - mountPath: /app
              name: code-volume
      volumes:
        - name: code-volume
          hostPath:
            path: /home/mac/OrangeASR
            type: Directory
---
# --- gateway Service ---
apiVersion: v1
kind: Service
metadata:
  name: asr-gateway-svc
spec:
  type: NodePort
  selector:
    app: asr-gateway
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
      nodePort: 30081 
---
# --- asr storage Deployment ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: asr-storage
  labels:
    app: asr-storage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: asr-storage
  template:
    metadata:
      labels:
        app: asr-storage
    spec:
      nodeName: raspberrypi
      containers:
        - name: storage
          image: flash-asr:1.2
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "src.storage_worker"]
          env:
            - name: PYTHONPATH
              value: "/app"
          envFrom:
            - configMapRef:
                name: asr-config
          volumeMounts:
            - mountPath: /app
              name: code-volume
      volumes:
        - name: code-volume
          hostPath:
            path: /home/mac/OrangeASR
            type: Directory
---
# --- asr worker Deployment ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: asr-worker
  labels:
    app: asr-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: asr-worker
  template:
    metadata:
      labels:
        app: asr-worker
    spec:
      nodeName: ubuntu       
      containers:
        - name: worker
          image: faster-whisper-cuda:1.2
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "src.asr_worker"]          
          env:
            - name: PYTHONPATH
              value: "/app"
            - name: ASR_DEVICE
              value: "cuda"
            - name: ASR_COMPUTE_TYPE
              value: "float16"
          envFrom:
            - configMapRef:
                name: asr-config      
          resources:
            limits:
              nvidia.com/gpu: 1              
          volumeMounts:
            - mountPath: /app
              name: code-volume
      volumes:
        - name: code-volume
          hostPath:
            path: /home/jetson/OrangeASR
            type: Directory   
---
# --- Refiner Worker Deployment ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: asr-refiner
  labels:
    app: asr-refiner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: asr-refiner
  template:
    metadata:
      labels:
        app: asr-refiner
    spec:
      nodeName: raspberrypi
      containers:
        - name: refiner
          image: flash-asr:1.2
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "src.refiner_worker"]
          env:
            - name: PYTHONPATH
              value: "/app"
          envFrom:
            - configMapRef:
                name: asr-config
          volumeMounts:
            - mountPath: /app
              name: code-volume
      volumes:
        - name: code-volume
          hostPath:
            path: /home/mac/OrangeASR
            type: Directory


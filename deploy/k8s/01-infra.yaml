apiVersion: v1
kind: Namespace
metadata:
  name: asr-service
---
# --- NATS JetStream ---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-config
  namespace: asr-service
data:
  nats.conf: |
    # Core configuration: allow large packets up to 10MB (audio data)
    max_payload: 10MB
    
    # Enable JetStream and specify storage path
    jetstream {
        store_dir: "/data"
    }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
  namespace: asr-service
spec:
  serviceName: nats
  replicas: 1
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
    spec:
      nodeSelector: 
        device: usbssd    
      initContainers:
      - name: fix-permissions
        image: busybox
        command: ["sh", "-c", "chown -R 1000:1000 /data"]
        volumeMounts:
        - name: nats-storage
          mountPath: /data    
      containers:
      - name: nats
        image: nats:2.10-alpine
        args: ["-c", "/etc/nats-config/nats.conf"] 
        ports:
        - containerPort: 4222
        volumeMounts:
        - name: nats-storage
          mountPath: /data
        - name: config-volume
          mountPath: /etc/nats-config
      volumes:
      - name: config-volume
        configMap:
          name: nats-config        
  volumeClaimTemplates:
  - metadata:
      name: nats-storage
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources: { requests: { storage: 5Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: asr-service
spec:
  type: NodePort
  ports:
  - port: 4222
    nodePort: 30742
  selector:
    app: nats
---
# --- MongoDB ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
  namespace: asr-service
spec:
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      nodeSelector: 
        device: usbssd
      containers:
      - name: mongo
        image: mongo:4.4.18
        # Limit memory to prevent exhausting Raspberry Pi RAM
        args: ["--wiredTigerCacheSizeGB", "0.5"]
        ports:
        - containerPort: 27017
        volumeMounts:
        - name: mongo-data
          mountPath: /data/db
      volumes:
      - name: mongo-data
        hostPath:
          path: /data/mongo_data
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: asr-service
spec:
  type: NodePort
  ports:
  - port: 27017
    nodePort: 30327
  selector:
    app: mongo

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: minio-local-pv
  labels:
    type: local
spec:
  storageClassName: manual
  capacity:
    storage: 50Gi 
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: "/data/minio" 
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - raspberrypi 

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-local-claim
  namespace: asr-service
spec:
  storageClassName: manual
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi  

    
---
apiVersion: v1
kind: Service
metadata:
  name: minio-service
  namespace: asr-service
spec:
  type: NodePort
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
      nodePort: 30091
    - name: console
      port: 9001
      targetPort: 9001
      nodePort: 30092


---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: asr-service
spec:
  selector:
    matchLabels:
      app: minio
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: minio
    spec:
      nodeSelector:
        kubernetes.io/hostname: raspberrypi 
      containers:
      - name: minio
        image: minio/minio:latest 
        args:
        - server
        - /data
        - --console-address
        - ":9001"
        env:
        - name: MINIO_ROOT_USER
          value: "admin"
        - name: MINIO_ROOT_PASSWORD
          value: "password123"
        ports:
        - containerPort: 9000
        - containerPort: 9001
        volumeMounts:
        - name: storage
          mountPath: "/data"
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: minio-local-claim 

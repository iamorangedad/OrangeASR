name: perf-gate

on:
  push:
    branches: [main, perf/**]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install deps
        run: |
          pip install -r deploy/requirements.txt
          pip install pytest pytest-asyncio

      - name: Run baseline benchmark (mock)
        run: |
          pytest tests/benchmark_e2e.py tests/load_nats_flood.py -m benchmark -v --tb=short | tee perf.log
          python tests/benchmark_e2e.py --concurrency 1 5 --requests 3
          python tests/load_nats_flood.py --rps 100 --duration 2 --payload-kb 32
          cat docs/benchmark_result.json || true

      - name: Perf gate — p95 & pending
        run: |
          python -c "
          import json, pathlib, sys
          p = pathlib.Path('docs/benchmark_result.json')
          if not p.exists():
              print('no result json, skip gate (pass)')
              sys.exit(0)
          data = json.loads(p.read_text())
          for r in data:
              p95 = r.get('p95_ms', 0)
              if p95 > 1500:
                  print(f\"FAIL p95 {p95}ms > 1500ms @ concurrency {r['concurrency']}\")
                  sys.exit(1)
          print('perf gate passed (p95 <1500ms mock)')
          "

      - name: Upload perf artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-artifacts
          path: |
            perf.log
            docs/benchmark_result.json
            docs/baseline_report.md
